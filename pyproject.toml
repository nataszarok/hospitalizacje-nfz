[tool.poetry]
name = "health-dashboard"
version = "0.1.0"
description = "Interaktywny dashboard hospitalizacji i śmiertelności w Streamlit."
authors = []

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
streamlit = ">=1.40,<2.0"
pandas = ">=2.2,<3.0"
plotly = ">=5.24,<7.0"
openpyxl = ">=3.1,<4.0"
numpy = ">=2.0,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
