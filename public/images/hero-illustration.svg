<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ilustracja hero: droga pacjenta przez szpital (karetka, szpital, łóżko z kroplówką, monitor EKG, dni pobytu). Własna grafika. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b3a35" flood-opacity=".13"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#087F75" fill-opacity=".12"/>
    </pattern>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tło -->
  <circle cx="1010" cy="560" r="430" fill="#DCEFEA" fill-opacity=".7"/>
  <circle cx="1010" cy="560" r="430" fill="url(#dots)"/>
  <circle cx="980" cy="520" r="300" fill="url(#halo)"/>
  <ellipse cx="1010" cy="846" rx="540" ry="30" fill="#0b3a35" fill-opacity=".07"/>

  <!-- Linia EKG: od szpitala do monitora -->
  <path d="M852 300H960l16-34 20 70 16-50 12 14H1164c50 0 80 30 80 70v60" stroke="#087F75" stroke-width="5" stroke-opacity=".3"/>

  <!-- Szpital -->
  <g filter="url(#shadow)">
    <rect x="556" y="560" width="120" height="282" rx="10" fill="#FFFFFF" stroke="#087F75" stroke-width="5"/>
    <rect x="636" y="380" width="330" height="462" rx="12" fill="#FFFFFF" stroke="#087F75" stroke-width="6"/>
  </g>
  <rect x="636" y="380" width="330" height="32" rx="12" fill="#E9F6F2" stroke="#087F75" stroke-width="6"/>
  <g fill="#E9F6F2" stroke="#087F75" stroke-width="4">
    <rect x="672" y="440" width="58" height="44" rx="6"/><rect x="772" y="440" width="58" height="44" rx="6"/><rect x="872" y="440" width="58" height="44" rx="6"/>
    <rect x="672" y="514" width="58" height="44" rx="6"/><rect x="772" y="514" width="58" height="44" rx="6"/><rect x="872" y="514" width="58" height="44" rx="6"/>
    <rect x="672" y="588" width="58" height="44" rx="6"/><rect x="772" y="588" width="58" height="44" rx="6"/><rect x="872" y="588" width="58" height="44" rx="6"/>
    <rect x="672" y="662" width="58" height="44" rx="6"/><rect x="872" y="662" width="58" height="44" rx="6"/>
    <rect x="582" y="604" width="68" height="42" rx="6"/><rect x="582" y="674" width="68" height="42" rx="6"/>
  </g>
  <rect x="758" y="740" width="86" height="102" rx="8" fill="#E9F6F2" stroke="#087F75" stroke-width="5"/>
  <line x1="801" y1="744" x2="801" y2="840" stroke="#087F75" stroke-width="4"/>
  <rect x="726" y="712" width="150" height="28" rx="8" fill="#087F75"/>
  <circle cx="801" cy="300" r="52" fill="#087F75"/>
  <path d="M801 270v60M771 300h60" stroke="#FFFFFF" stroke-width="14"/>
  <line x1="801" y1="352" x2="801" y2="380" stroke="#087F75" stroke-width="6"/>

  <!-- Karetka: przyjęcie -->
  <g transform="matrix(.85 0 0 .85 145.5 127)">
  <rect x="1012" y="712" width="30" height="14" rx="5" fill="#C9772E"/>
  <g stroke="#087F75" stroke-width="5">
    <path d="M970 740a14 14 0 0 1 14-14h120v100h-120a14 14 0 0 1-14-14z" fill="#FFFFFF"/>
    <path d="M1104 750h30l34 32v44h-64z" fill="#FFFFFF"/>
    <path d="M1114 760h18l22 22h-40z" fill="#E9F6F2"/>
    <path d="M970 796h198" stroke-opacity=".4"/>
  </g>
  <path d="M1034 750v40M1014 770h40" stroke="#087F75" stroke-width="11"/>
  <g fill="#055850" stroke="#FFFFFF" stroke-width="4"><circle cx="1012" cy="830" r="19"/><circle cx="1132" cy="830" r="19"/></g>
  <g fill="#FFFFFF"><circle cx="1012" cy="830" r="6"/><circle cx="1132" cy="830" r="6"/></g>
  </g>

  <g transform="translate(-6 0)">
  <!-- Monitor EKG -->
  <g filter="url(#shadow)">
    <rect x="1180" y="430" width="200" height="136" rx="16" fill="#FFFFFF" stroke="#087F75" stroke-width="5"/>
  </g>
  <rect x="1198" y="448" width="164" height="88" rx="8" fill="#055850"/>
  <path d="M1208 496h30l10-24 14 48 12-34 8 10h28l8-12 8 12h28" stroke="#7FE0D2" stroke-width="5"/>
  <g fill="#087F75"><circle cx="1210" cy="552" r="5"/><circle cx="1228" cy="552" r="5" fill-opacity=".4"/></g>
  <line x1="1280" y1="566" x2="1280" y2="616" stroke="#087F75" stroke-width="6"/>

  <!-- Łóżko szpitalne z pacjentem -->
  <g stroke="#087F75" stroke-width="5">
    <rect x="1176" y="640" width="18" height="182" rx="7" fill="#FFFFFF"/>
    <rect x="1426" y="690" width="16" height="132" rx="7" fill="#FFFFFF"/>
    <rect x="1188" y="712" width="244" height="32" rx="10" fill="#E9F6F2"/>
    <rect x="1204" y="690" width="64" height="24" rx="10" fill="#FFFFFF"/>
    <circle cx="1240" cy="680" r="20" fill="#FFFFFF"/>
    <path d="M1270 712c10-24 40-32 70-32h70c10 0 16 8 16 16v16z" fill="#FFFFFF"/>
    <path d="M1188 770h244"/>
  </g>
  <g fill="#055850"><circle cx="1206" cy="836" r="11"/><circle cx="1412" cy="836" r="11"/></g>

  <!-- Kroplówka -->
  <g stroke="#087F75" stroke-width="5">
    <path d="M1496 560v276M1468 836h56M1476 566h40"/>
    <rect x="1476" y="576" width="40" height="62" rx="12" fill="#E9F6F2"/>
    <path d="M1486 600h20" stroke-opacity=".5"/>
  </g>
  <path d="M1496 638c0 50-30 70-90 74" stroke="#087F75" stroke-width="3" stroke-opacity=".6"/>

  </g>

  <!-- Kalendarz: dni pobytu i wypis -->
  <g transform="translate(1236 168) rotate(4)">
    <rect width="190" height="168" rx="16" fill="#FFFFFF" stroke="#087F75" stroke-width="5" filter="url(#shadow)"/>
    <path d="M0 16a16 16 0 0 1 16-16h158a16 16 0 0 1 16 16v26H0z" fill="#087F75"/>
    <g stroke="#055850" stroke-width="6"><path d="M50-10v22M140-10v22"/></g>
    <g fill="#087F75">
      <rect x="20" y="58" width="28" height="22" rx="5"/><rect x="58" y="58" width="28" height="22" rx="5"/><rect x="96" y="58" width="28" height="22" rx="5"/>
      <rect x="134" y="58" width="28" height="22" rx="5" fill-opacity=".2"/>
      <rect x="20" y="90" width="28" height="22" rx="5" fill-opacity=".2"/><rect x="58" y="90" width="28" height="22" rx="5" fill-opacity=".2"/><rect x="96" y="90" width="28" height="22" rx="5" fill-opacity=".2"/><rect x="134" y="90" width="28" height="22" rx="5" fill-opacity=".2"/>
      <rect x="20" y="122" width="28" height="22" rx="5" fill-opacity=".2"/><rect x="58" y="122" width="28" height="22" rx="5" fill-opacity=".2"/><rect x="96" y="122" width="28" height="22" rx="5" fill-opacity=".2"/>
    </g>
    <circle cx="148" cy="133" r="20" fill="#FFFFFF" stroke="#C9772E" stroke-width="5"/>
    <path d="M139 133l7 7 12-14" stroke="#C9772E" stroke-width="5"/>
  </g>
</svg>
