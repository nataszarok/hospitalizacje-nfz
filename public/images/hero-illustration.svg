<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ilustracja hero: szpital, rozliczenie NFZ, kontrola, liczby i środki publiczne. Własna grafika. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b3a35" flood-opacity=".13"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#087F75" fill-opacity=".12"/>
    </pattern>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tło -->
  <circle cx="1010" cy="560" r="430" fill="#DCEFEA" fill-opacity=".7"/>
  <circle cx="1010" cy="560" r="430" fill="url(#dots)"/>
  <circle cx="980" cy="520" r="300" fill="url(#halo)"/>
  <ellipse cx="1010" cy="812" rx="520" ry="34" fill="#0b3a35" fill-opacity=".07"/>

  <!-- Szpital: skrzydła -->
  <g filter="url(#shadow)">
    <rect x="590" y="540" width="190" height="262" rx="10" fill="#FFFFFF" stroke="#087F75" stroke-width="5"/>
    <rect x="1170" y="500" width="240" height="302" rx="10" fill="#FFFFFF" stroke="#087F75" stroke-width="5"/>
    <!-- Bryła główna -->
    <rect x="760" y="350" width="430" height="452" rx="12" fill="#FFFFFF" stroke="#087F75" stroke-width="6"/>
  </g>
  <rect x="760" y="350" width="430" height="34" rx="12" fill="#E9F6F2" stroke="#087F75" stroke-width="6"/>

  <!-- Okna bryły głównej -->
  <g fill="#E9F6F2" stroke="#087F75" stroke-width="4">
    <rect x="800" y="414" width="58" height="44" rx="6"/><rect x="886" y="414" width="58" height="44" rx="6"/><rect x="1006" y="414" width="58" height="44" rx="6"/><rect x="1092" y="414" width="58" height="44" rx="6"/>
    <rect x="800" y="490" width="58" height="44" rx="6"/><rect x="886" y="490" width="58" height="44" rx="6"/><rect x="1006" y="490" width="58" height="44" rx="6"/><rect x="1092" y="490" width="58" height="44" rx="6"/>
    <rect x="800" y="566" width="58" height="44" rx="6"/><rect x="886" y="566" width="58" height="44" rx="6"/><rect x="1006" y="566" width="58" height="44" rx="6"/><rect x="1092" y="566" width="58" height="44" rx="6"/>
    <rect x="800" y="642" width="58" height="44" rx="6"/><rect x="1092" y="642" width="58" height="44" rx="6"/>
    <!-- Okna skrzydeł -->
    <rect x="1206" y="546" width="70" height="44" rx="6"/><rect x="1304" y="546" width="70" height="44" rx="6"/>
    <rect x="1206" y="620" width="70" height="44" rx="6"/><rect x="1304" y="620" width="70" height="44" rx="6"/>
    <rect x="1206" y="694" width="70" height="44" rx="6"/><rect x="1304" y="694" width="70" height="44" rx="6"/>
    <rect x="626" y="584" width="54" height="40" rx="6"/><rect x="700" y="584" width="54" height="40" rx="6"/>
  </g>

  <!-- Wejście z daszkiem -->
  <rect x="918" y="700" width="114" height="102" rx="8" fill="#E9F6F2" stroke="#087F75" stroke-width="5"/>
  <line x1="975" y1="704" x2="975" y2="800" stroke="#087F75" stroke-width="4"/>
  <rect x="880" y="672" width="190" height="28" rx="8" fill="#087F75"/>

  <!-- Znak szpitala -->
  <circle cx="975" cy="288" r="52" fill="#087F75"/>
  <path d="M975 258v60M945 288h60" stroke="#FFFFFF" stroke-width="14"/>
  <line x1="975" y1="340" x2="975" y2="350" stroke="#087F75" stroke-width="6"/>

  <!-- Karta: wykres (liczby) -->
  <g transform="translate(1236 236) rotate(3)">
    <rect width="250" height="190" rx="18" fill="#FFFFFF" stroke="#087F75" stroke-width="5" filter="url(#shadow)"/>
    <line x1="28" y1="38" x2="118" y2="38" stroke="#087F75" stroke-width="8" stroke-opacity=".35"/>
    <line x1="28" y1="160" x2="222" y2="160" stroke="#087F75" stroke-width="4" stroke-opacity=".4"/>
    <g fill="#087F75">
      <rect x="40" y="118" width="26" height="42" rx="5" fill-opacity=".35"/>
      <rect x="80" y="100" width="26" height="60" rx="5" fill-opacity=".5"/>
      <rect x="120" y="108" width="26" height="52" rx="5" fill-opacity=".5"/>
      <rect x="160" y="80" width="26" height="80" rx="5" fill-opacity=".75"/>
    </g>
    <path d="M53 106 L93 86 L133 94 L173 64 L210 52" stroke="#055850" stroke-width="5"/>
    <circle cx="210" cy="52" r="8" fill="#055850"/>
  </g>

  <!-- Karta: rozliczenie NFZ -->
  <g transform="translate(470 470) rotate(-5)">
    <rect width="320" height="400" rx="20" fill="#FFFFFF" stroke="#087F75" stroke-width="5" filter="url(#shadow)"/>
    <path d="M0 20a20 20 0 0 1 20-20h280a20 20 0 0 1 20 20v44H0z" fill="#087F75"/>
    <line x1="30" y1="32" x2="150" y2="32" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="232" y1="32" x2="290" y2="32" stroke="#FFFFFF" stroke-width="8" stroke-opacity=".6"/>
    <g stroke="#087F75" stroke-width="6">
      <line x1="30" y1="104" x2="170" y2="104" stroke-opacity=".3"/><line x1="226" y1="104" x2="290" y2="104" stroke-opacity=".65"/>
      <line x1="30" y1="146" x2="150" y2="146" stroke-opacity=".3"/><line x1="236" y1="146" x2="290" y2="146" stroke-opacity=".65"/>
      <line x1="30" y1="188" x2="182" y2="188" stroke-opacity=".3"/><line x1="216" y1="188" x2="290" y2="188" stroke-opacity=".65"/>
      <line x1="30" y1="230" x2="140" y2="230" stroke-opacity=".3"/><line x1="240" y1="230" x2="290" y2="230" stroke-opacity=".65"/>
    </g>
    <line x1="30" y1="266" x2="290" y2="266" stroke="#087F75" stroke-width="3" stroke-opacity=".35"/>
    <line x1="30" y1="300" x2="120" y2="300" stroke="#055850" stroke-width="9"/>
    <line x1="206" y1="300" x2="290" y2="300" stroke="#055850" stroke-width="9"/>
    <!-- Pieczęć kontroli -->
    <circle cx="246" cy="350" r="34" fill="#FFFFFF" stroke="#C9772E" stroke-width="5" stroke-dasharray="7 6"/>
    <path d="M230 351l11 11 21-23" stroke="#C9772E" stroke-width="7"/>
  </g>

  <!-- Lupa: kontrola -->
  <g>
    <circle cx="790" cy="610" r="74" fill="#FFFFFF" fill-opacity=".45" stroke="#055850" stroke-width="15"/>
    <path d="M843 663l78 78" stroke="#055850" stroke-width="24"/>
    <path d="M748 586a48 48 0 0 1 34-26" stroke="#FFFFFF" stroke-width="9" stroke-opacity=".9"/>
  </g>

  <!-- Monety: środki publiczne -->
  <g stroke="#087F75" stroke-width="5">
    <ellipse cx="1418" cy="842" rx="62" ry="18" fill="#E9F6F2"/>
    <path d="M1356 842v-22M1480 842v-22" />
    <ellipse cx="1418" cy="820" rx="62" ry="18" fill="#E9F6F2"/>
    <path d="M1356 820v-22M1480 820v-22" />
    <ellipse cx="1418" cy="798" rx="62" ry="18" fill="#FFFFFF"/>
    <ellipse cx="1500" cy="854" rx="44" ry="13" fill="#E9F6F2"/>
  </g>
  <text x="1418" y="806" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#087F75">zł</text>
</svg>
